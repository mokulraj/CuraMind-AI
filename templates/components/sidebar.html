{% load static %}

<aside
    class="sidebar"
    id="mainSidebar"
    aria-label="Primary navigation"
>

    <!-- BRAND -->
    <div class="sidebar-brand">

        <a
            href="{% url 'web:home' %}"
            class="sidebar-brand-link"
        >

            <span class="brand-mark">
                C
            </span>

            <span class="brand-text">
                CuraMind
                <strong>AI</strong>
            </span>

        </a>

    </div>


    <!-- NAVIGATION -->
    <nav
        class="sidebar-navigation"
        aria-label="Application navigation"
    >

        <!-- OVERVIEW -->

        <div class="sidebar-header">
            <span class="sidebar-section-title">
                OVERVIEW
            </span>
        </div>


        <a
            href="{% url 'web:home' %}"
            class="sidebar-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                H
            </span>

            <span>
                Dashboard
            </span>

        </a>


        <a
            href="/ai-insights/"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                AI
            </span>

            <span>
                AI Insights
            </span>

        </a>


        <div class="sidebar-divider"></div>


        <!-- CLINICAL -->

        <div class="sidebar-header">
            <span class="sidebar-section-title">
                CLINICAL
            </span>
        </div>


        <a
            href="{% url 'web:appointments' %}"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                A
            </span>

            <span>
                Appointments
            </span>

        </a>


        <a
            href="{% url 'web:patients' %}"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                P
            </span>

            <span>
                Patients
            </span>

        </a>


        <a
            href="/medical-records/"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                R
            </span>

            <span>
                Medical Records
            </span>

        </a>


        <a
            href="/imaging/"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                I
            </span>

            <span>
                Imaging
            </span>

        </a>


        <div class="sidebar-divider"></div>


        <!-- MANAGEMENT -->

        <div class="sidebar-header">
            <span class="sidebar-section-title">
                MANAGEMENT
            </span>
        </div>


        <a
            href="/reports/"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                R
            </span>

            <span>
                Reports
            </span>

        </a>


        <a
            href="{% url 'web:notifications' %}"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                N
            </span>

            <span>
                Notifications

                {% if unread_notification_count %}
                    <span class="sidebar-notification-count">
                        {{ unread_notification_count }}
                    </span>
                {% endif %}

            </span>

        </a>


        <a
            href="/settings/"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                S
            </span>

            <span>
                Settings
            </span>

        </a>

    </nav>


    <!-- BOTTOM ACTIONS -->

    <div class="sidebar-bottom">

        <a
            href="#"
            class="sidebar-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                ?
            </span>

            <span>
                Help &amp; Support
            </span>

        </a>


        <a
            href="/logout/"
            class="sidebar-link logout-link"
        >

            <span
                class="sidebar-icon"
                aria-hidden="true"
            >
                →
            </span>

            <span>
                Logout
            </span>

        </a>

    </div>

</aside>
