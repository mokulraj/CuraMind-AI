{% if messages %}

    <section
        class="messages-container"
        aria-label="System messages"
    >

        {% for message in messages %}

            <div
                class="message message-{{ message.tags|default:'info' }}"
                role="alert"
            >

                <span class="message-text">
                    {{ message }}
                </span>

                <button
                    type="button"
                    class="message-close"
                    aria-label="Dismiss message"
                >
                    ×
                </button>

            </div>

        {% endfor %}

    </section>

{% endif %}
