<header class="site-header">

    <nav
        class="navbar"
        aria-label="Primary navigation"
    >

        <div class="navbar-container">

            <a
                href="/"
                class="brand"
                aria-label="CuraMind AI home"
            >
                <span class="brand-mark">
                    C
                </span>

                <span class="brand-name">
                    CuraMind AI
                </span>
            </a>

            <button
                type="button"
                class="navbar-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="primary-navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div
                id="primary-navigation"
                class="navbar-menu"
            >

                <a
                    href="/"
                    class="navbar-link"
                >
                    Home
                </a>

                {% if request.user.is_authenticated %}

                    <a
                        href="/dashboard/"
                        class="navbar-link"
                    >
                        Dashboard
                    </a>

                    {% if request.user.role == "DOCTOR" %}
                        <a
                            href="/appointments/"
                            class="navbar-link"
                        >
                            Appointments
                        </a>
                    {% endif %}

                    {% if request.user.role == "PATIENT" %}
                        <a
                            href="/appointments/"
                            class="navbar-link"
                        >
                            My Appointments
                        </a>
                    {% endif %}

                    <a
                        href="/api/v1/auth/me/"
                        class="navbar-link"
                    >
                        Profile
                    </a>

                    <form
                        method="post"
                        action="/logout/"
                        class="logout-form"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="navbar-button"
                        >
                            Logout
                        </button>
                    </form>

                {% else %}

                    <a
                        href="/login/"
                        class="navbar-button"
                    >
                        Login
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>

</header>
