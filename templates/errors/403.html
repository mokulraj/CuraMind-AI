{% extends "base.html" %}

{% block title %}
    Access Denied | CuraMind AI
{% endblock %}

{% block content %}

<section class="error-page">

    <div class="error-container">

        <span class="error-code">
            403

        <h1>

        <p>
            You do not have permission to access
            this resource.

        <a
            href="/"

            Return home
        </a>

    </div>

</section>

{% endblock %}
