services:

  postgres:
    image: postgres:16-alpine

    container_name: curamind-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - curamind_network


  redis:
    image: redis:7-alpine

    container_name: curamind-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000"
      ]

    volumes:
      - redis_data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - curamind_network


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: curamind-web

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "${GUNICORN_WORKERS:-3}",
        "--threads",
        "${GUNICORN_THREADS:-2}",
        "--timeout",
        "${GUNICORN_TIMEOUT:-120}",
        "--graceful-timeout",
        "${GUNICORN_GRACEFUL_TIMEOUT:-30}",
        "--keep-alive",
        "${GUNICORN_KEEPALIVE:-5}",
        "--max-requests",
        "${GUNICORN_MAX_REQUESTS:-1000}",
        "--max-requests-jitter",
        "${GUNICORN_MAX_REQUESTS_JITTER:-100}",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
        "--log-level",
        "${GUNICORN_LOG_LEVEL:-info}"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    ports:
      - "${WEB_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "manage.py",
          "check"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - curamind_network


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: curamind-celery-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    command:
      [
        "celery",
        "-A",
        "config.celery",
        "worker",
        "--loglevel=INFO",
        "--hostname=curamind-worker@%h"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - media_data:/app/media

    networks:
      - curamind_network


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: curamind-celery-beat

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    command:
      [
        "celery",
        "-A",
        "config.celery",
        "beat",
        "--loglevel=INFO"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - curamind_network


volumes:

  postgres_data:
    name: curamind_postgres_data

  redis_data:
    name: curamind_redis_data

  static_data:
    name: curamind_static_data

  media_data:
    name: curamind_media_data


networks:

  curamind_network:
    name: curamind_network
    driver: bridge