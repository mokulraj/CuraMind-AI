services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16-alpine

    container_name: curamind-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - curamind_network


  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:7-alpine

    container_name: curamind-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000"
      ]

    volumes:
      - redis_data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - curamind_network


  # ============================================================
  # Django Web
  # ============================================================

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: curamind-web

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    command:
      [
        "gunicorn",
        "--config",
        "config/gunicorn.conf.py",
        "config.wsgi:application"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    ports:
      - "${WEB_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "manage.py",
          "check"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - curamind_network


  # ============================================================
  # Celery Worker
  # ============================================================

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: curamind-celery-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    command:
      [
        "celery",
        "-A",
        "config.celery",
        "worker",
        "--loglevel=INFO",
        "--hostname=curamind-worker@%h"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - media_data:/app/media

    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "config.celery",
          "inspect",
          "ping"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - curamind_network


  # ============================================================
  # Celery Beat
  # ============================================================

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: curamind-celery-beat

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    command:
      [
        "celery",
        "-A",
        "config.celery",
        "beat",
        "--loglevel=INFO"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - curamind_network


  # ============================================================
  # Nginx
  # ============================================================

  nginx:
    image: nginx:1.28-alpine

    container_name: curamind-nginx

    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "${NGINX_PORT:-80}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

    networks:
      - curamind_network


# ==============================================================
# Volumes
# ==============================================================

volumes:

  postgres_data:
    name: curamind_postgres_data

  redis_data:
    name: curamind_redis_data

  static_data:
    name: curamind_static_data

  media_data:
    name: curamind_media_data


# ==============================================================
# Network
# ==============================================================

networks:

  curamind_network:
    name: curamind_network
    driver: bridge